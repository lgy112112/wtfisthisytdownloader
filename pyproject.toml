[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "download-yt-script"
version = "0.1.0"
description = "Single-file YouTube downloader script"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "yt-dlp",
]

[project.urls]
Homepage = "https://github.com/yourusername/ytdl"

[tool.setuptools]
py-modules = ["download_yt"]
